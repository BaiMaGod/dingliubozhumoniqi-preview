  v.shot=composition(v.x,v.y);v.phase='edit';v.editAt=now;

 }
 tick(now=Date.now()) {
  const v=this.s.active;if(v?.phase!=='edit')return false;
  const elapsed=Math.max(0,now-v.editAt);v.remaining=Math.max(0,v.remaining-elapsed);v.editAt=now;

 }

  this.tick(now);const v=this.s.active;if(v?.phase!=='edit')return false;
  if(kind!=='tap' && (!['open','highlight','end'].includes(kind)||v.cuts.includes(kind)))return false;

  v.taps++;v.remaining=Math.max(0,v.remaining-(kind==='tap'?550:1800)*(1+.025*(this.s.stats.editing-1)));

 }

  const s=this.s,t=TOPICS.find(t=>t.id===v.topicId);
  v.inputs={...s.stats,lamp:s.lamp,audience:s.fans,first:this.first,heat:t.heat};
  v.quality=Math.round(clamp((28+v.shot*.4+v.cuts.length*5+Math.min(12,(s.stats.filming-1)*1.2))*(s.lamp?1.1:1),15,100));
  v.completion=Math.round(clamp(35+v.quality*.4+v.cuts.length*4,0,95));

  v.comments=Math.floor(v.views*.004);v.fans=Math.max(1,Math.floor(v.views*.012));

  const a=v.inputs, q=v.quality;
  const stop=clamp(.055+v.round*.025+(v.round>=5?.12:0),.055,.37);
  const sink=clamp(.24-(q-40)*.004-(a.persistence-1)*.008,.025,.32);
  const viral=clamp(.012+(q-50)*.0006+(a.sense-1)*.0015+(a.luck-1)*.002+(a.trend-1)*.001,.005,.12);

 refresh() {

  else if(r<p.stop+p.sink+p.viral+p.boost)event='推流';

   const scale=[1,4,18,90,500,3000,15000][v.tier];

 }

  if(this.s.active||!this.unlocked||!Object.hasOwn(STAT_LABELS,stat)||this.s.points<1||this.s.stats[stat]>=50)return false;

function header(){return `<header class="creator-header"><div class="brand"><span>${icon('play')}</span><div><small>从 0 开始的创作生活</small><h1>顶流博主模拟器</h1></div></div><span class="chapter">${game.unlocked?'第 '+(game.s.works.length+1)+' 条作品':'DAY 01 · 初心'}</span></header><div class="minimal-hud"><span>${icon('heart')}<b>${num(game.s.fans)}</b><small>粉丝</small></span><span>${icon('coin')}<b>¥ ${num(game.s.wallet)}</b><small>余额</small></span></div>`;}
function room(){const unlocked=game.unlocked;return `<main class="room-view"><div class="chapter-title"><small class="day-stamp">第一天 · 我的出租屋</small><h2>${game.s.lamp?'一点一点，照亮梦想':'顶流，从这里开始'}</h2><p>${unlocked?'你的下一条作品，会被更多人看见吗？':'一部旧手机，拍下你的第一个小小瞬间。'}</p></div><div class="rental-scene"><span class="room-location">${icon('home')} 12㎡ · 起步出租屋</span>${roomArt(game.s.lamp)}<div class="sun-motes" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div><button class="only-phone" data-do="phone" aria-label="点击桌上的旧手机"><span class="phone-halo"></span><span class="phone-spark" aria-hidden="true">✦</span><span class="phone-label">${icon('phone')} ${unlocked?'拍下一条':'点击手机 · 开始创作'} ${icon('chevron')}</span></button><span class="room-caption">${game.s.lamp?'旧手机 ＋ 二手补光灯':'这里很小，梦想可以很大'}</span></div><div class="story-note"><span>${icon(unlocked?'spark':'pen')}</span><div><strong>${unlocked?'下一站：100 粉丝':'今天，先迈出小小一步'}</strong><p>${unlocked?'从拍摄到推流，每条作品都让你更熟练。':'点击桌上发光的手机，开始拍摄。'}</p></div></div>${unlocked?`<nav class="room-unlocks" aria-label="已解锁的成长系统"><button data-do="growth">${icon('growth')} 成长 <em>${game.s.points}点</em></button><button data-do="works">${icon('film')} 作品 <em>${game.s.works.length}条</em></button><button data-do="equipment">${icon('bulb')} 补光灯 ${game.s.lamp?icon('check'):''}</button></nav><div class="next-milestone"><span>千粉后，解锁作品收益</span><b>${num(game.s.fans)} / 1,000</b><i><b style="width:${Math.min(100,game.s.fans/1000*100)}%"></b></i></div>`:''}</main>`;}
function steps(phase){const i=['shoot','edit','ready','live','ended'].indexOf(phase);return `<div class="creation-steps" aria-label="创作进度">${['拍摄','剪辑','发布','推流'].map((s,n)=>`<span class="${n<i?'done':n===Math.min(i,3)?'current':''}"><i>${n<i?'✓':n+1}</i>${s}</span>`).join('')}</div>`;}
function phoneShell(body,phase=''){return `<main class="phone-view"><div class="phone-shell"><div class="phone-status"><span>09:41</span><i></i><span>▮▮▮ ▰</span></div><div class="phone-appbar"><button data-do="home" aria-label="返回出租屋">‹</button><b>小小创作日记</b><span>${icon('phone')}</span></div>${phase?steps(phase):''}${body}<span class="home-indicator"></span></div><p class="phone-footnote">${game.s.active?'作品进度会自动保存':'从一部旧手机，开始你的第一步'}</p></main>`;}
function phone(){return phoneShell(`<div class="phone-welcome"><span class="app-mark">${icon('play')}</span><small>我的第一条作品</small><h2>${game.first?'平凡日常，也值得被看见':'今天想记录什么？'}</h2><p>${game.first?'就从眼前这只爱跳舞的小猫开始。':'试试不同题材，找出属于你的创作节奏。'}</p>${game.first?`<div class="first-topic"><span class="topic-sticker">今日灵感</span><div class="topic-cat">${catArt()}</div><div class="topic-copy"><strong>小猫的第一支舞</strong><small>萌宠日常 · 免费拍摄</small></div><span class="topic-decoration" aria-hidden="true">♪</span></div>`:`<div class="topic-options">${TOPICS.map(t=>`<button data-do="start" data-topic="${t.id}">${icon(t.id==='dance'?'flame':'film')}<span><b>${t.title}</b><small>${t.tag}${t.heat?' · 热度 +'+t.heat:''}</small></span>${icon('chevron')}</button>`).join('')}</div>`}${game.first?`<button class="creator-cta" data-do="start">${icon('equipment')} 拍我的第一条视频 ${icon('arrow')}</button>`:''}</div>`);}
function videoStage(v,shoot=false){return `<div class="video-stage ${shoot?'camera-stage':'recorded-stage'} topic-${v.topicId}" ${shoot?'id="viewfinder" tabindex="0" role="group" aria-label="拖动镜头调整角度；也可以用方向键"':''}><div class="video-wall"><i class="poster"></i><i class="window-light"></i></div><div class="video-floor"></div><span class="camera-lens-glint" aria-hidden="true"></span><div class="performer-position" ${shoot?'id="performer"':''}>${catArt(v.topicId)}</div>${shoot?'<div class="thirds" aria-hidden="true"><i></i><i></i><b></b><b></b></div><div class="reticle" id="reticle" aria-hidden="true"><i></i><i></i><i></i><i></i></div><span class="camera-rec"><i></i> 正在取景</span><span class="angle-label" id="angle-label"></span>':`<span class="video-tag"># ${TOPICS.find(t=>t.id===v.topicId).tag}</span><span class="video-caption">${v.title}</span>`}</div>`;}
function shoot(){const v=game.s.active;return phoneShell(`<div class="phone-content"><div class="screen-title"><small>第一步 · 拍出好构图</small><h2>把小猫放进取景框</h2><p>拖动画面调整镜头，找到好角度。</p></div>${videoStage(v,true)}<div class="composition-card"><div><span>构图评分 <b id="shot-score"></b></span><strong id="shot-rating"></strong></div><div class="score-track"><i id="score-fill"></i></div><small id="steady-copy">对准后稳住片刻，试试五星构图</small></div><div class="camera-adjust" aria-label="镜头方向微调">${[['left','←','向左调整'],['up','↑','向上调整'],['down','↓','向下调整'],['right','→','向右调整']].map(([id,g,l])=>`<button data-do="adjust" data-direction="${id}" aria-label="${l}">${g}</button>`).join('')}</div><button class="creator-cta capture-cta" data-do="capture">${icon('equipment')} 拍下这一刻 <span id="capture-caption"></span></button></div>`,'shoot');}
function editing(){const v=game.s.active;return phoneShell(`<div class="phone-content"><div class="screen-title"><small>第二步 · 让日常更精彩</small><h2>剪出一个高光瞬间</h2><p>点画面加速，点素材提升视频质量。</p></div><button class="edit-zone" data-do="edit" data-kind="tap" aria-label="点击画面加快剪辑"><div class="mini-film">${catArt(v.topicId)}</div><span class="editing-overlay">${icon('cut')} 点击加速剪辑</span></button><div class="editing-time"><span>剪辑剩余</span><b id="edit-time">${(v.remaining/1000).toFixed(1)}<small>秒</small></b></div><div class="edit-track"><i id="edit-progress" style="width:${100*(1-v.remaining/v.editTotal)}%"></i></div><div class="highlight-clips" aria-label="高光剪辑素材">${[['open','开头','pen'],['highlight','高光','spark'],['end','结尾','film']].map(([id,label,ico])=>`<button data-do="edit" data-kind="${id}" ${v.cuts.includes(id)?'disabled':''}>${icon(v.cuts.includes(id)?'check':ico)}<b>${label}</b><small>${v.cuts.includes(id)?'已加入':'−1.8秒 · +品质'}</small></button>`).join('')}</div><div class="editing-note">${icon('check')} 拍摄 ${v.shot} 分　${v.cuts.length} / 3 个高光已加入</div></div>`,'edit');}
function ready(){const v=game.s.active;return phoneShell(`<div class="phone-content ready-content"><span class="success-mark">${icon('check')}</span><small>你的作品，准备好了</small><h2>把这一刻分享出去</h2><div class="ready-preview">${catArt(v.topicId)}<span>${v.title}</span></div><div class="ready-scores"><span>拍摄构图<b>${v.shot} 分</b></span><span>高光剪辑<b>${v.cuts.length} / 3</b></span></div><p>下一步，你会亲手刷新作品数据，\n看它如何被更多人发现。</p><button class="creator-cta" data-do="publish">${icon('share')} 发布视频 ${icon('arrow')}</button></div>`,'ready');}
function live(){const v=game.s.active,ended=v.phase==='ended';const cls=v.event==='爆火'?'viral':v.event==='推流'?'boost':ended?'ended':'';return phoneShell(`<div class="phone-content feed-content ${cls}" id="feed"><div class="feed-heading"><span>作品数据</span><small>第 ${v.round} 轮反馈</small></div><div class="feed-preview">${catArt(v.topicId)}<span>${v.title}</span><i>内容质量 ${v.quality}</i></div><div class="algorithm-status ${cls}"><span>${icon(v.event==='爆火'?'flame':ended?'check':'chart')}</span><div><strong>${v.event==='爆火'?'爆款诞生！':v.event}</strong><small>${ended?v.reason:v.event==='推流'?'更多观众正在发现你的作品':v.event==='爆火'?'这条作品进入了热门推荐':'作品正在接受观众的第一轮反馈'}</small></div></div><div class="view-total"><small>作品播放量</small><strong id="live-views">${num(v.views)}</strong><span>本轮 +${num(v.history.at(-1).delta)} 播放</span></div><div class="live-metrics"><span>${icon('heart')}<b>${num(v.likes)}</b><small>点赞</small></span><span>${icon('chat')}<b>${num(v.comments)}</b><small>评论</small></span><span>${icon('growth')}<b>+${num(v.fans)}</b><small>新增粉丝</small></span></div><div class="feed-curve" aria-label="播放增长曲线">${v.history.map(h=>`<i style="height:${Math.max(8,h.target/v.views*100)}%" title="${h.event} ${h.target}播放"></i>`).join('')}</div>${ended?`<button class="creator-cta" data-do="result">${icon('gift')} 查看这条作品的结算 ${icon('arrow')}</button>`:`<div class="pull-instruction"><b>↓</b><strong>向下滑动，刷新一次数据</strong><small>每次下拉，揭晓一轮推荐反馈</small></div><button class="refresh-button" data-do="refresh">${icon('chart')} 刷新一次数据</button>`}<p class="algorithm-note">${v.inputs.first?'首条作品：体验推荐过程，从小小播放开始':'拍摄、剪辑与成长，影响下一轮推荐的机会'}</p></div>`,'live');}
function result(){const v=game.s.active,r=game.reward;if(!r)return room();return phoneShell(`<div class="phone-content result-content"><span class="success-mark">${icon(v.event==='沉没'?'film':'trophy')}</span><small>第 ${v.id} 条作品 · ${v.event}</small><h2>${v.id===1?'第一批观众，看见你了':'每条作品，都是一次成长'}</h2><div class="result-big"><b>${num(v.views)}</b><span>最终播放</span></div><div class="result-rewards"><span>${icon('heart')}新增粉丝<strong>+${r.fans}</strong></span><span>${icon('coin')}作品收入<strong>¥ ${r.income}</strong></span>${r.grant?`<span>${icon('gift')}首创奖励<strong>¥ ${r.grant}</strong></span>`:''}<span>${icon('growth')}成长点<strong>+${r.points}</strong></span></div><div class="growth-recap">${icon('spark')} 拍摄 +1 · 剪辑 +1 · 坚持 +1${v.shot>=85?' · 网感 +1':''}</div><p>${r.grant?'首创奖励可用于购买第一盏补光灯。':'收好这次经验，下一条继续冲击更大流量。'}<br>${v.inputs.audience<1000?'千粉后开放作品收入，首创奖励仅领一次。':''}</p><button class="creator-cta" data-do="claim">${icon('gift')} 领取，回到出租屋 ${icon('arrow')}</button></div>`,'ended');}
function panelHead(kicker,title,copy){return `<div class="panel-head"><button data-do="home" aria-label="返回出租屋">‹</button><small>${kicker}</small><h2>${title}</h2><p>${copy}</p></div>`;}
function growth(){return `<main class="unlocked-panel">${panelHead('SMALL STEPS, BIG DREAMS','你的创作能力','自动积累熟练度，也可以用成长点选择发展方向。')}<div class="points-banner">${icon('growth')} 可分配成长点 <b>${game.s.points}</b></div><div class="creator-stats">${Object.entries(STAT_LABELS).map(([k,n],i)=>`<article><span>${icon(['target','clover','equipment','cut','flame','leaf'][i])}</span><h3>${n}<b>${game.s.stats[k]}</b></h3><p>${desc[k]}</p><button data-do="upgrade" data-stat="${k}" ${game.s.points<1||game.s.stats[k]>=50?'disabled':''}>＋ 升级</button></article>`).join('')}</div></main>`;}
function works(){return `<main class="unlocked-panel">${panelHead('MY CREATIVE DIARY','每个小瞬间，都被记住','回看推流过程，看看你的好构图带来了什么。')}<div class="works-list">${[...game.s.works].reverse().map(v=>`<article><span class="work-number">${String(v.id).padStart(2,'0')}</span><div><h3>${v.title}</h3><p>${num(v.views)} 播放 · +${v.fans} 粉丝</p><small>拍摄 ${v.shot} 分 · 内容质量 ${v.quality}</small><details><summary>查看 ${v.history.length} 轮推荐过程</summary>${v.history.map(h=>`<p>${h.event}<b>+${num(h.delta)} 播放</b></p>`).join('')}</details></div><span class="work-end">${v.event}</span></article>`).join('')}</div></main>`;}
function equipment(){return `<main class="unlocked-panel equipment-panel">${panelHead('LIGHT UP YOUR NEXT VIDEO','第一盏补光灯','小小的升级，让下一条作品更明亮。')}<div class="lamp-showcase">${roomArt(true)}</div><div class="lamp-offer"><span>${icon('bulb')}</span><small>二手设备 · 可靠好用</small><h3>二手补光灯</h3><p>未来作品质量 +10%<br>购买后会真实出现在桌上</p><strong>¥ 99</strong><button class="creator-cta" data-do="lamp" ${game.s.lamp?'disabled':''}>${icon(game.s.lamp?'check':'coin')}${game.s.lamp?'已经摆好，去拍下一条吧':'买下我的第一盏灯'}</button></div></main>`;}
function render(){const builders={room,phone,shoot,edit:editing,ready,live,result,growth,works,equipment};root.innerHTML=header()+(builders[screen]||room)()+`<div id="toast" class="creator-toast" role="status" aria-live="polite"></div>${!storage||game.storageFailed?'<p class="storage-warning">浏览器未能保存进度，关闭页面后可能丢失本次试玩。</p>':''}`;document.body.dataset.screen=screen;if(screen==='shoot')updateCamera();if(previousScreen!==screen)window.scrollTo(0,0);previousScreen=screen;}
function updateCamera(){const v=game.s.active;if(v?.phase!=='shoot')return;const score=composition(v.x,v.y),el=$('#performer');if(!el)return;el.style.transform=`translate(calc(-50% + ${v.x}px), calc(-50% + ${v.y}px)) rotate(${v.x*.06}deg)`;$('#shot-score').textContent=score+' / 100';$('#shot-rating').textContent='★'.repeat(Math.max(1,Math.round(score/20)))+'☆'.repeat(5-Math.max(1,Math.round(score/20)));$('#score-fill').style.width=score+'%';$('#reticle').classList.toggle('aligned',score>=85);$('#angle-label').textContent=`左右 ${Math.round(v.x*.15)}° · 上下 ${Math.round(v.y*.15)}°`;$('#capture-caption').textContent=score>=85?'好角度！':'随时可拍';if(score<85){stableSince=0;stable=false;}$('#steady-copy').textContent=stable?'五星构图！可以拍下这一刻':score>=85?'对准了，稳住镜头片刻…':'对准后稳住片刻，试试五星构图';}
function doRefresh(){if(performance.now()<refreshUntil){hint('正在揭晓本轮数据，稍等片刻再下拉');return;}const event=game.refresh();if(!event)return;refreshUntil=performance.now()+650;feedback(event==='爆火'?'viral':'tap');render();if(event==='推流'||event==='爆火')$('#live-views')?.classList.add('number-pop');}
root.addEventListener('click',e=>{const el=e.target.closest('[data-do]');if(!el||el.disabled)return;const a=el.dataset.do;
 if(a==='home'){if(game.s.active){hint('先完成当前作品，进度会自动保存');return;}screen='room';}
 else if(a==='phone')screen='phone';
 else if(a==='start'){if(!game.start(el.dataset.topic))return;screen='shoot';}
 else if(a==='adjust'){const [dx,dy]=({left:[-8,0],right:[8,0],up:[0,-8],down:[0,8]})[el.dataset.direction];game.move(dx,dy);stableSince=0;updateCamera();return;}
 else if(a==='capture'){if(!game.capture())return;screen='edit';feedback('capture');}
 else if(a==='edit'){if(el.dataset.kind==='tap'&&performance.now()-lastTap<80)return;lastTap=performance.now();if(!game.edit(el.dataset.kind))return;screen=game.s.active.phase;feedback();}
 else if(a==='publish'){if(!game.publish())return;screen='live';feedback();}
 else if(a==='refresh'){doRefresh();return;}
 else if(a==='result')screen='result';
 else if(a==='claim'){const reward=game.claim();if(!reward)return;screen='room';feedback();render();hint(`新增 ${reward.fans} 位粉丝，成长 +${reward.points} 点`);return;}
 else if(['growth','works','equipment'].includes(a)){if(!game.unlocked||game.s.active)return;screen=a;}
 else if(a==='upgrade'){if(!game.upgrade(el.dataset.stat))return;feedback();}
 else if(a==='lamp'){if(!game.buyLamp())return;screen='room';feedback();render();hint('补光灯摆好了！下一条作品质量 +10%');return;}
 render();
});
root.addEventListener('pointerdown',e=>{const camera=e.target.closest('#viewfinder'),feed=e.target.closest('#feed');if(e.target.closest('button')||(!camera&&!feed)||!e.isPrimary)return;const el=camera||feed;drag={id:e.pointerId,x:e.clientX,y:e.clientY,startX:e.clientX,startY:e.clientY,kind:camera?'camera':'feed',el};el.setPointerCapture(e.pointerId);if(camera){stableSince=0;stable=false;}});
root.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;if(drag.kind==='camera'){game.move(e.clientX-drag.x,e.clientY-drag.y);drag.x=e.clientX;drag.y=e.clientY;updateCamera();}else if($('#feed')){$('#feed').style.setProperty('--pull',Math.min(35,Math.max(0,e.clientY-drag.startY)*.25)+'px');}});
function endDrag(e,cancel=false){if(!drag||drag.id!==e.pointerId)return;const d=drag;drag=null;if(d.el.hasPointerCapture?.(e.pointerId))d.el.releasePointerCapture(e.pointerId);if(d.kind==='feed'){$('#feed')?.style.setProperty('--pull','0px');if(!cancel&&e.clientY-d.startY>55&&Math.abs(e.clientX-d.startX)<95)doRefresh();}}
root.addEventListener('pointerup',e=>endDrag(e));root.addEventListener('pointercancel',e=>endDrag(e,true));
root.addEventListener('keydown',e=>{if(!e.target.closest('#viewfinder'))return;const delta={ArrowLeft:[-8,0],ArrowRight:[8,0],ArrowUp:[0,-8],ArrowDown:[0,8]}[e.key];if(delta){e.preventDefault();game.move(...delta);stableSince=0;updateCamera();}});
setInterval(()=>{if(game.s.active?.phase==='edit'){const ready=game.tick();if(ready){screen='ready';render();feedback();}else{const v=game.s.active;if($('#edit-time'))$('#edit-time').innerHTML=(v.remaining/1000).toFixed(1)+'<small>秒</small>';if($('#edit-progress'))$('#edit-progress').style.width=100*(1-v.remaining/v.editTotal)+'%';}}
 if(screen==='shoot'&&game.s.active&&composition(game.s.active.x,game.s.active.y)>=85&&!drag){if(!stableSince)stableSince=performance.now();if(!stable&&performance.now()-stableSince>=800){stable=true;updateCamera();feedback();}}},100);
window.addEventListener('pagehide',()=>game.save());
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&game.s.active?.phase==='edit'&&game.tick()){screen='ready';render();}});
render();
</script>
